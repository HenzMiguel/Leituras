<main class="min-h-screen bg-base-200/60 px-5 py-8 sm:px-8 lg:px-12">
    <div class="mx-auto max-w-5xl">
        <a class="btn btn-ghost btn-sm mb-10 -ml-3 gap-2 text-base-content/65" routerLink="/livros">
            <span aria-hidden="true">←</span> Voltar para a biblioteca
        </a>

        @if (livro(); as livroSelecionado) {
            <app-livro-card [livro]="livroSelecionado" />
        } @else {
            <section class="rounded-box border border-dashed border-base-300 bg-base-100 px-6 py-20 text-center">
                <p class="font-display text-2xl font-bold">Livro não encontrado</p>
                <p class="mt-2 text-base-content/60">Esse título não está na sua biblioteca.</p>
                <a class="btn btn-primary mt-6" routerLink="/livros">Ver todos os livros</a>
            </section>
        }
    </div>
</main>
